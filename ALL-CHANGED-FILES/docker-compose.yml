version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: casino_platform
      MYSQL_USER: casino
      MYSQL_PASSWORD: your_password_here
      MYSQL_ROOT_PASSWORD: your_password_here
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pyour_password_here"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    ports:
      - "3020:3020"
    environment:
      - NODE_ENV=development
      - PORT=3020
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=casino_platform
      - DB_USER=casino
      - DB_PASSWORD=your_password_here
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change_this_secret
      - JWT_REFRESH_SECRET=change_this_refresh_secret
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3020/api
    depends_on:
      - backend

volumes:
  mysqldata:
  redisdata:
