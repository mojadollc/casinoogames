name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Deploy mode"
        required: false
        default: all
        type: choice
        options:
          - all
          - frontend
          - backend
          - database
          - skip

env:
  NODE_VERSION: "20"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  test-frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 3

  test-engine:
    name: Game Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --check game-engine/engine.js
      - name: RNG smoke
        run: |
          node -e "
            const { GameEngine } = require('./game-engine/engine');
            const r = new GameEngine().spin(10);
            if (!r.grid || r.grid.length !== 5) process.exit(1);
            console.log('engine ok');
          "

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-engine]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode != 'skip')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              - 'game-engine/**'
            database:
              - 'database/**'
            deploy:
              - 'deploy.sh'
              - 'deploy-vps.sh'
              - 'nginx/**'
              - '.github/workflows/**'

      - name: Resolve deploy flags
        id: flags
        shell: bash
        run: |
          MODE="${{ github.event.inputs.deploy_mode }}"
          MODE="${MODE:-auto}"
          FE=false; BE=false; DB=false
          case "$MODE" in
            all) FE=true; BE=true; DB=true ;;
            frontend) FE=true ;;
            backend) BE=true ;;
            database) DB=true ;;
            *)
              FE=${{ steps.changes.outputs.frontend }}
              BE=${{ steps.changes.outputs.backend }}
              DB=${{ steps.changes.outputs.database }}
              DEP=${{ steps.changes.outputs.deploy }}
              if [ "$FE" != "true" ] && [ "$BE" != "true" ] && [ "$DB" != "true" ] && [ "$DEP" != "true" ]; then
                FE=true; BE=true; DB=true
              fi
              [ "$DEP" = "true" ] && BE=true
              ;;
          esac
          echo "fe=$FE" >> "$GITHUB_OUTPUT"
          echo "be=$BE" >> "$GITHUB_OUTPUT"
          echo "db=$DB" >> "$GITHUB_OUTPUT"
          echo "Plan FE=$FE BE=$BE DB=$DB"

      - name: Sync code to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude .git --exclude node_modules --exclude '*/node_modules' --exclude frontend/build --exclude '*.log' --exclude .env --exclude 'backend/uploads/*'
          path: ./
          remote_path: /opt/casino-platform/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: 22

      - name: Install migrate build restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEED_FE: ${{ steps.flags.outputs.fe }}
          NEED_BE: ${{ steps.flags.outputs.be }}
          NEED_DB: ${{ steps.flags.outputs.db }}
          DOMAIN: ${{ secrets.DOMAIN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: NEED_FE,NEED_BE,NEED_DB,DOMAIN
          script: |
            set -e
            APP_DIR=/opt/casino-platform
            DOMAIN="${DOMAIN:-reelx.lazapee.ph}"
            cd "$APP_DIR"

            if [ ! -f .env.production ]; then
              echo "Missing $APP_DIR/.env.production on server"
              exit 1
            fi

            PORT=$(grep -E '^PORT=' .env.production | cut -d= -f2 | tr -d '"' | tr -d "'" || true)
            PORT=${PORT:-3020}

            if [ "$NEED_DB" = "true" ]; then
              echo "DB migrations..."
              cd "$APP_DIR/database"
              npm ci --omit=dev 2>/dev/null || npm install --omit=dev
              for f in migrations/00*.js; do
                echo "  $f"
                node "$f" || true
              done
              node seeders/seed.js || true
              node seeders/seed-games.js || true
            fi

            if [ "$NEED_BE" = "true" ]; then
              echo "Backend install + PM2..."
              cd "$APP_DIR/backend"
              mkdir -p uploads/thumbnails
              npm ci --omit=dev 2>/dev/null || npm install --omit=dev
              cat > "$APP_DIR/ecosystem.config.cjs" <<'ECO'
            module.exports = {
              apps: [{
                name: 'casino-backend',
                cwd: '/opt/casino-platform/backend',
                script: 'server.js',
                instances: 1,
                max_memory_restart: '512M',
                restart_delay: 3000,
                env: { NODE_ENV: 'production' },
              }],
            };
            ECO
              # Fix accidental indent from YAML if any
              sed -i 's/^            //' "$APP_DIR/ecosystem.config.cjs" || true
              if pm2 describe casino-backend >/dev/null 2>&1; then
                pm2 reload "$APP_DIR/ecosystem.config.cjs" --update-env || pm2 restart casino-backend --update-env
              else
                pm2 start "$APP_DIR/ecosystem.config.cjs"
              fi
              pm2 save
            fi

            if [ "$NEED_FE" = "true" ]; then
              echo "Frontend build..."
              cd "$APP_DIR/frontend"
              npm ci 2>/dev/null || npm install
              VITE_API_URL=$(grep -E '^VITE_API_URL=' "$APP_DIR/.env.production" | cut -d= -f2- | tr -d '"' || true)
              VITE_SOCKET_URL=$(grep -E '^VITE_SOCKET_URL=' "$APP_DIR/.env.production" | cut -d= -f2- | tr -d '"' || true)
              VITE_API_URL=${VITE_API_URL:-https://$DOMAIN/api}
              VITE_SOCKET_URL=${VITE_SOCKET_URL:-https://$DOMAIN}
              export VITE_API_URL VITE_SOCKET_URL
              npm run build
              test -d build
              nginx -t && systemctl reload nginx || true
            fi

            echo "Health check..."
            sleep 4
            for i in $(seq 1 12); do
              if curl -sf "http://127.0.0.1:${PORT}/health" >/dev/null; then
                echo "Backend healthy"
                exit 0
              fi
              echo "  wait $i/12..."
              sleep 3
            done
            echo "Health check failed"
            pm2 logs casino-backend --lines 30 --nostream || true
            exit 1

      - name: Public health check
        shell: bash
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          DOMAIN="${DOMAIN:-reelx.lazapee.ph}"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" "https://${DOMAIN}/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "https://${DOMAIN}/health OK"
              exit 0
            fi
            echo "  public health $CODE (try $i)"
            sleep 5
          done
          echo "Public health not 200 yet (DNS/SSL?). Server deploy may still be OK."
